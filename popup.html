<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ChatGPT Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e5e5e5;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #10a37f;
    }
    .status {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .status strong { color: #10a37f; }
    button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #2f2f2f;
      color: #fff;
      transition: background 0.15s;
    }
    button:hover { background: #3a3a3a; }
    button.primary { background: #10a37f; }
    button.primary:hover { background: #0d8c6d; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row button { flex: 1; }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h1>ChatGPT Exporter</h1>

  <div class="status" id="status">
    Ready. Open a ChatGPT conversation and click Scrape.
  </div>

  <button class="primary" id="btnScrape">Scrape Conversation</button>

  <div class="row">
    <button id="btnCopy">Copy Markdown</button>
    <button id="btnJson">Download JSON</button>
  </div>
  <button id="btnMd">Download Markdown</button>

  <div class="row" style="margin-top:6px;">
    <button id="btnClaude">Send → Claude</button>
    <button id="btnGemini">Send → Gemini</button>
  </div>

  <p class="hint">
    Tip: "Send →" opens the target site and auto-injects once it loads — watch
    the toolbar icon for a ✓ or !. If it fails, use Copy Markdown and paste manually.
  </p>

  <script src="popup.js"></script>
</body>
</html>
